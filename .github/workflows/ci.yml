name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Execute all notebooks (offline)
        env:
          # No notebook downloads anything: all text is toy data and every number is computed
          # in the notebook. ATTN_OFFLINE=1 makes that explicit for CI.
          ATTN_OFFLINE: "1"
        run: |
          for nb in notebooks/*.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute --inplace \
              --ExecutePreprocessor.timeout=1800 "$nb"
            echo "::endgroup::"
          done

      - name: Confirm notebooks produced output
        run: |
          python - <<'PY'
          import glob, nbformat, sys
          bad = []
          files = sorted(glob.glob("notebooks/*.ipynb"))
          for f in files:
              nb = nbformat.read(f, 4)
              if not any(c.cell_type == "code" and c.get("outputs") for c in nb.cells):
                  bad.append(f)
          if bad:
              print("No outputs in:", bad); sys.exit(1)
          print(f"All {len(files)} notebooks executed with outputs.")
          PY
